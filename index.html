<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Groundtime - Fluxo Visual</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }

      body {
        margin: 0;
        background: #f8fafc;
        color: #0f172a;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 24px;
      }
      h1 {
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 16px;
        color: #334155;
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(280px, 420px) 1fr;
        gap: 16px;
      }
      .panel {
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 16px;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
      }
      textarea {
        width: 100%;
        min-height: 560px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 13px;
        line-height: 1.4;
        resize: vertical;
        box-sizing: border-box;
      }
      .actions {
        margin-top: 12px;
        display: flex;
        gap: 8px;
      }
      button {
        border: 0;
        border-radius: 8px;
        background: #2563eb;
        color: #fff;
        font-weight: 600;
        padding: 10px 14px;
        cursor: pointer;
      }
      button.secondary {
        background: #334155;
      }
      .status {
        margin-top: 10px;
        font-size: 14px;
      }
      .status.error {
        color: #b91c1c;
      }
      .diagram {
        overflow: auto;
      }
      @media (max-width: 980px) {
        .layout {
          grid-template-columns: 1fr;
        }
        textarea {
          min-height: 260px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Criador de Fluxo Visual (Mermaid)</h1>
      <p>
        O conteúdo de <code id="source-file-label"></code> é carregado automaticamente.
        Você pode editar e renderizar novamente.
      </p>

      <div class="layout">
        <section class="panel">
          <label for="code"><strong>Código Mermaid</strong></label>
          <textarea id="code" spellcheck="false"></textarea>
          <div class="actions">
            <button id="renderBtn" type="button">Renderizar fluxo</button>
            <button id="reloadBtn" type="button" class="secondary">Recarregar arquivo</button>
          </div>
          <div id="status" class="status" role="status" aria-live="polite"></div>
        </section>

        <section class="panel diagram" aria-labelledby="diagram-title">
          <h2 id="diagram-title" style="margin-top: 0">Resultado do fluxo</h2>
          <div id="output" aria-live="polite" aria-label="Diagrama Mermaid renderizado" tabindex="-1"></div>
        </section>
      </div>
    </div>

    <script type="module">
      import mermaid from './vendor/mermaid.esm.min.mjs';

      mermaid.initialize({
        startOnLoad: false,
        securityLevel: 'strict',
        flowchart: { htmlLabels: false },
      });

      const input = document.getElementById('code');
      const output = document.getElementById('output');
      const statusEl = document.getElementById('status');
      const sourceFile = 'code-1789249679287.txt';
      const defaultDiagramCode = "flowchart TD\n    %% ESTILOS VISUAIS\n    classDef startFill fill:#0F172A,stroke:#0F172A,stroke-width:2px,color:#FFFFFF\n    classDef processFill fill:#F8FAFC,stroke:#64748B,stroke-width:2px,color:#0F172A\n    classDef actionFill fill:#EFF6FF,stroke:#3B82F6,stroke-width:2px,color:#1E3A8A\n    classDef decisionFill fill:#FEF3C7,stroke:#F59E0B,stroke-width:2px,color:#78350F\n    classDef formulaFill fill:#DCFCE7,stroke:#16A34A,stroke-width:2px,color:#14532D\n\n    Start([<b>PERGUNTA</b><br>Como o AIMS determina e calcula o Ground Time?]):::startFill --> Step1\n\n    Step1[<b>1. Consulta da Rota do Avi\u00e3o</b><br>O AIMS acessa o plano de rota cadastrado no sistema<br><i>Aircraft Route Screen - Option 1.1.1</i>]:::processFill --> Step2\n\n    Step2[<b>2. Leitura dos Hor\u00e1rios Programados</b><br>Identifica na rota os valores de:<br>\u2022 <code>STA</code> da etapa de chegada<br>\u2022 <code>STD</code> da pr\u00f3xima etapa]:::actionFill --> CheckReschedule\n\n    CheckReschedule{<b>Houve FLIGHT RESCHEDULE?</b><br><i>Op\u00e7\u00e3o 'Re-schedule' aplicada no AIMS</i>}:::decisionFill\n\n    %% CAMINHO RESCHEDULE\n    CheckReschedule -- <b>SIM</b> --> PathReschedule[<b>Atualiza\u00e7\u00e3o de Linha de Base</b><br>A altera\u00e7\u00e3o manual grava novos hor\u00e1rios de <code>STA</code> e/ou <code>STD</code> na rota]:::actionFill\n    PathReschedule --> CalcFormula\n\n    %% CAMINHO PADR\u00c3O\n    CheckReschedule -- <b>N\u00c3O</b> --> PathNormal[<b>Linha de Base Corrente</b><br>O sistema usa os hor\u00e1rios de <code>STA</code> e <code>STD</code> j\u00e1 gravados no plano de rota]:::processFill\n    PathNormal --> CalcFormula\n\n    %% F\u00d3RMULA CENTRAL\n    CalcFormula[<b>3. F\u00d3RMULA DE C\u00c1LCULO DO GROUND TIME NO AIMS</b><br><br><code>Ground Time = ProximoLeg.STD - AtualLeg.STA</code><br><br><i>O AIMS ignora o banco de dados padr\u00e3o de aeroportos durante a propaga\u00e7\u00e3o</i>]:::formulaFill --> Application\n\n    Application[<b>4. Aplica\u00e7\u00e3o Pr\u00e1tica no Sistema</b><br>Quando o <code>ETA</code> atualiza ou entra mensagem de movimento:<br><code>Novo ETD = Novo ETA + Ground Time</code>]:::processFill --> EndProcess([<b>RESULTADO</b><br>Ground Time Definido e Propagado no AIMS]):::startFill";
      const sourceFileLabel = document.getElementById('source-file-label');
      let latestRenderRequest = 0;
      let renderQueue = Promise.resolve();

      sourceFileLabel.textContent = sourceFile;

      function setStatus(message, isError = false) {
        statusEl.textContent = message;
        statusEl.className = `status${isError ? ' error' : ''}`;
      }

      function buildDiagramDescription(code) {
        const firstLine = code
          .split('\n')
          .map((line) => line.trim())
          .find((line) => line.length > 0);
        return firstLine ? `Diagrama Mermaid: ${firstLine}` : 'Diagrama Mermaid renderizado';
      }

      function getErrorMessage(error) {
        if (error instanceof Error && error.message) return error.message;
        if (typeof error === 'string' && error.trim()) return error;
        return 'Falha inesperada.';
      }

      function sanitizeSvg(svg) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(svg, 'image/svg+xml');
        const svgRoot = doc.documentElement;
        const blockedElements = new Set([
          'script',
          'foreignobject',
          'animate',
          'animatemotion',
          'animatecolor',
          'animatetransform',
          'set',
        ]);
        const refAttrs = new Set(['href', 'xlink:href', 'src']);
        const urlMatchesAreSafe = (input) => {
          const urlRegex = /url\(\s*(['"]?)(.*?)\1\s*\)/gi;
          const hasUrlFunction = /url\(/i.test(input);
          let matchCount = 0;
          let match;
          while ((match = urlRegex.exec(input)) !== null) {
            matchCount += 1;
            const target = (match[2] || '').trim();
            const normalizedTarget = target.replace(/^['"]|['"]$/g, '').trim().toLowerCase();
            if (!/^#[a-z_][\w:.-]*$/i.test(normalizedTarget)) return false;
          }
          if (hasUrlFunction && matchCount === 0) return false;
          return true;
        };
        const sanitizeStyleValue = (styleValue) => {
          const safeDeclarations = styleValue
            .split(';')
            .map((declaration) => declaration.trim())
            .filter(Boolean)
            .filter((declaration) => {
              const normalized = declaration.toLowerCase();
              if (normalized.includes('javascript:')) return false;
              if (normalized.includes('expression(')) return false;
              if (normalized.includes('url(') && !urlMatchesAreSafe(declaration)) return false;
              return true;
            });
          return safeDeclarations.join('; ');
        };

        if (!svgRoot || svgRoot.nodeName.toLowerCase() !== 'svg') {
          throw new Error('Saída SVG inválida.');
        }

        svgRoot.querySelectorAll('*').forEach((node) => {
          const tag = (node.localName || '').toLowerCase();
          if (blockedElements.has(tag)) {
            node.remove();
          }
        });

        svgRoot.querySelectorAll('*').forEach((node) => {
          [...node.attributes].forEach((attr) => {
            const name = attr.name.toLowerCase();
            const value = attr.value.trim();
            const normalizedValue = value.toLowerCase();
            const isExternalRefAttr = refAttrs.has(name);
            const isExternalProtocol =
              normalizedValue.startsWith('http:') ||
              normalizedValue.startsWith('https:') ||
              normalizedValue.startsWith('javascript:') ||
              normalizedValue.startsWith('data:');
            const hasUnsafeUrlValue =
              normalizedValue.includes('url(') &&
              !urlMatchesAreSafe(value);

            if (name === 'style') {
              const safeStyle = sanitizeStyleValue(value);
              if (!safeStyle) {
                node.removeAttribute(attr.name);
              } else {
                node.setAttribute(attr.name, safeStyle);
              }
              return;
            }

            if (
              name.startsWith('on') ||
              (isExternalRefAttr && (isExternalProtocol || !value.startsWith('#'))) ||
              hasUnsafeUrlValue
            ) {
              node.removeAttribute(attr.name);
            }
          });
        });

        return svgRoot;
      }

      async function loadFile() {
        try {
          const response = await fetch(sourceFile, {
            credentials: 'same-origin',
            cache: 'no-store',
          });
          if (!response.ok) {
            throw new Error(`Falha ao carregar ${sourceFile} (${response.status})`);
          }
          input.value = await response.text();
          setStatus('Arquivo carregado com sucesso.');
          await renderDiagram();
        } catch (error) {
          input.value = defaultDiagramCode;
          output.replaceChildren();
          output.textContent = 'Arquivo local carregado a partir do conteúdo embutido.';
          output.setAttribute('aria-label', 'Diagrama carregado por fallback local');
          output.setAttribute('aria-invalid', 'false');
          output.setAttribute('role', 'alert');
          setStatus(`Não foi possível ler ${sourceFile}. Usando conteúdo embutido localmente.`, true);
          await renderDiagram();
        }
      }

      async function renderDiagram() {
        const requestId = ++latestRenderRequest;
        const currentRender = async () => {
          const code = input.value.trim();
          if (!code) {
            output.replaceChildren();
            output.textContent = 'Código Mermaid vazio.';
            output.setAttribute('role', 'alert');
            output.setAttribute('aria-label', 'Falha: código Mermaid vazio');
            output.setAttribute('aria-invalid', 'true');
            setStatus('Cole um código Mermaid para renderizar.', true);
            return;
          }

          try {
            const uniqueId =
              typeof crypto !== 'undefined' && crypto.randomUUID
                ? crypto.randomUUID()
                : `${Date.now()}-${Math.random().toString(16).slice(2)}`;
            const id = `diagram-${uniqueId}`;
            const { svg } = await mermaid.render(id, code);
            const sanitizedSvg = sanitizeSvg(svg);
            if (requestId !== latestRenderRequest) return;
            output.replaceChildren(sanitizedSvg);
            output.setAttribute('aria-label', buildDiagramDescription(code));
            output.setAttribute('aria-invalid', 'false');
            output.removeAttribute('role');
            setStatus('Fluxo renderizado com sucesso.');
          } catch (error) {
            if (requestId !== latestRenderRequest) return;
            output.replaceChildren();
            output.setAttribute('aria-label', 'Falha ao renderizar diagrama Mermaid');
            output.setAttribute('aria-invalid', 'true');
            output.setAttribute('role', 'alert');
            setStatus(`Erro ao renderizar: ${getErrorMessage(error)}`, true);
          }
        };
        const execution = renderQueue.then(currentRender);
        renderQueue = execution.catch(() => {});
        await execution;
      }

      document.getElementById('renderBtn').addEventListener('click', renderDiagram);
      document.getElementById('reloadBtn').addEventListener('click', loadFile);

      loadFile();
    </script>
  </body>
</html>
