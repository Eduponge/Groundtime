<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Groundtime - Fluxo Visual</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }

      body {
        margin: 0;
        background: #f8fafc;
        color: #0f172a;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 24px;
      }
      h1 {
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 16px;
        color: #334155;
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(280px, 420px) 1fr;
        gap: 16px;
      }
      .panel {
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 16px;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
      }
      textarea {
        width: 100%;
        min-height: 560px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 13px;
        line-height: 1.4;
        resize: vertical;
        box-sizing: border-box;
      }
      .actions {
        margin-top: 12px;
        display: flex;
        gap: 8px;
      }
      button {
        border: 0;
        border-radius: 8px;
        background: #2563eb;
        color: #fff;
        font-weight: 600;
        padding: 10px 14px;
        cursor: pointer;
      }
      button.secondary {
        background: #334155;
      }
      .status {
        margin-top: 10px;
        font-size: 14px;
      }
      .status.error {
        color: #b91c1c;
      }
      .diagram {
        overflow: auto;
      }
      @media (max-width: 980px) {
        .layout {
          grid-template-columns: 1fr;
        }
        textarea {
          min-height: 260px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Criador de Fluxo Visual (Mermaid)</h1>
      <p>
        O conteúdo de <code>code-1789249679287.txt</code> é carregado automaticamente.
        Você pode editar e renderizar novamente.
      </p>

      <div class="layout">
        <section class="panel">
          <label for="code"><strong>Código Mermaid</strong></label>
          <textarea id="code" spellcheck="false"></textarea>
          <div class="actions">
            <button id="renderBtn" type="button">Renderizar fluxo</button>
            <button id="reloadBtn" type="button" class="secondary">Recarregar arquivo</button>
          </div>
          <div id="status" class="status" role="status" aria-live="polite"></div>
        </section>

        <section class="panel diagram" aria-labelledby="diagram-title">
          <h2 id="diagram-title" style="margin-top: 0">Resultado do fluxo</h2>
          <div id="output" aria-live="polite" aria-label="Diagrama Mermaid renderizado" tabindex="-1"></div>
        </section>
      </div>
    </div>

    <script type="module">
      import mermaid from './vendor/mermaid.esm.min.mjs';

      mermaid.initialize({
        startOnLoad: false,
        securityLevel: 'strict',
        flowchart: { htmlLabels: false },
      });

      const input = document.getElementById('code');
      const output = document.getElementById('output');
      const statusEl = document.getElementById('status');
      const sourceFile = 'code-1789249679287.txt';

      function setStatus(message, isError = false) {
        statusEl.textContent = message;
        statusEl.className = `status${isError ? ' error' : ''}`;
      }

      function buildDiagramDescription(code) {
        const firstLine = code
          .split('\n')
          .map((line) => line.trim())
          .find((line) => line.length > 0);
        return firstLine ? `Diagrama Mermaid: ${firstLine}` : 'Diagrama Mermaid renderizado';
      }

      function getErrorMessage(error) {
        if (error instanceof Error && error.message) return error.message;
        if (typeof error === 'string' && error.trim()) return error;
        return 'Falha inesperada.';
      }

      function remapSvgIds(svgRoot, prefix) {
        const idMap = new Map();
        const refAttrs = ['href', 'xlink:href', 'filter', 'mask', 'clip-path', 'fill', 'stroke', 'marker-start', 'marker-mid', 'marker-end'];
        const remapReferenceValue = (value) => {
          let nextValue = value;
          nextValue = nextValue.replace(/url\(\s*#([^)]+)\s*\)/g, (match, id) => {
            const mapped = idMap.get(id.trim());
            return mapped ? `url(#${mapped})` : match;
          });

          if (nextValue.startsWith('#')) {
            const rawId = nextValue.slice(1).trim();
            const mapped = idMap.get(rawId);
            if (mapped) return `#${mapped}`;
          }

          return nextValue;
        };

        svgRoot.querySelectorAll('[id]').forEach((node) => {
          const oldId = node.getAttribute('id');
          const newId = `${prefix}-${oldId}`;
          idMap.set(oldId, newId);
          node.setAttribute('id', newId);
        });

        svgRoot.querySelectorAll('*').forEach((node) => {
          refAttrs.forEach((attr) => {
            const value = node.getAttribute(attr);
            if (!value) return;
            const nextValue = remapReferenceValue(value);
            node.setAttribute(attr, nextValue);
          });
        });
      }

      function sanitizeSvg(svg, idPrefix) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(svg, 'image/svg+xml');
        const svgRoot = doc.documentElement;
        const blockedElements = new Set([
          'script',
          'foreignobject',
          'animate',
          'animatetransform',
          'set',
        ]);
        const refAttrs = new Set(['href', 'xlink:href', 'src']);
        const urlAttrs = new Set([
          'filter',
          'mask',
          'clip-path',
          'fill',
          'stroke',
          'marker-start',
          'marker-mid',
          'marker-end',
        ]);
        const localUrlPattern = /^url\(\s*(['"]?)#.+\1\s*\)$/i;

        if (!svgRoot || svgRoot.nodeName.toLowerCase() !== 'svg') {
          throw new Error('Saída SVG inválida.');
        }

        svgRoot.querySelectorAll('*').forEach((node) => {
          const tag = (node.localName || '').toLowerCase();
          if (blockedElements.has(tag)) {
            node.remove();
          }
        });

        svgRoot.querySelectorAll('*').forEach((node) => {
          [...node.attributes].forEach((attr) => {
            const name = attr.name.toLowerCase();
            const value = attr.value.trim();
            const normalizedValue = value.toLowerCase();
            const isExternalRefAttr = refAttrs.has(name);
            const isExternalProtocol =
              normalizedValue.startsWith('http:') ||
              normalizedValue.startsWith('https:') ||
              normalizedValue.startsWith('javascript:') ||
              normalizedValue.startsWith('data:');
            const hasUnsafeUrlAttr = urlAttrs.has(name) && normalizedValue.includes('url(') && !localUrlPattern.test(value);
            const hasUnsafeStyleUrl =
              name === 'style' &&
              normalizedValue.includes('url(') &&
              [...value.matchAll(/url\(\s*(['"]?)(.*?)\1\s*\)/gi)].some((match) => {
                const target = (match[2] || '').trim();
                return !target.startsWith('#');
              });

            if (
              name.startsWith('on') ||
              (isExternalRefAttr && (isExternalProtocol || !value.startsWith('#'))) ||
              hasUnsafeUrlAttr ||
              hasUnsafeStyleUrl
            ) {
              node.removeAttribute(attr.name);
            }
          });
        });

        remapSvgIds(svgRoot, idPrefix);
        return svgRoot;
      }

      async function loadFile() {
        try {
          const response = await fetch(sourceFile, {
            credentials: 'same-origin',
            cache: 'no-store',
          });
          if (!response.ok) {
            throw new Error(`Falha ao carregar ${sourceFile} (${response.status})`);
          }
          input.value = await response.text();
          setStatus('Arquivo carregado com sucesso.');
          await renderDiagram();
        } catch (error) {
          setStatus(getErrorMessage(error), true);
        }
      }

      async function renderDiagram() {
        const code = input.value.trim();
        if (!code) {
          output.innerHTML = '';
          setStatus('Cole um código Mermaid para renderizar.', true);
          return;
        }

        try {
          const uniqueId =
            typeof crypto !== 'undefined' && crypto.randomUUID
              ? crypto.randomUUID()
              : `${Date.now()}-${Math.random().toString(16).slice(2)}`;
          const id = `diagram-${uniqueId}`;
          const { svg } = await mermaid.render(id, code);
          output.replaceChildren(sanitizeSvg(svg, id));
          output.setAttribute('aria-label', buildDiagramDescription(code));
          output.focus();
          setStatus('Fluxo renderizado com sucesso.');
        } catch (error) {
          output.replaceChildren();
          output.setAttribute('aria-label', 'Falha ao renderizar diagrama Mermaid');
          setStatus(`Erro ao renderizar: ${getErrorMessage(error)}`, true);
        }
      }

      document.getElementById('renderBtn').addEventListener('click', renderDiagram);
      document.getElementById('reloadBtn').addEventListener('click', loadFile);

      loadFile();
    </script>
  </body>
</html>
